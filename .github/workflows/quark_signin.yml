name: Quark签到

on:
  schedule:
    - cron: '25 16 * * *'
    - cron: '47 5 * * *'
  workflow_dispatch:

jobs:
  check-if-already-signed:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置北京日期（用于缓存key）
        id: date
        run: echo "date=$(TZ='Asia/Shanghai' date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: 恢复签到标记缓存
        uses: actions/cache@v4
        with:
          path: .last_success_date
          key: quark-sign-success-${{ steps.date.outputs.date }}

      - name: 判断今天是否已签到
        id: check
        run: |
          current_date=$(TZ='Asia/Shanghai' date '+%Y-%m-%d')
          echo "当前北京日期：$current_date"
          if [ -f .last_success_date ]; then
            last_date=$(cat .last_success_date)
            if [ "$last_date" = "$current_date" ]; then
              echo "今天已经签到过，跳过执行"
              echo "should_run=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "今天尚未签到，准备执行"
          echo "should_run=true" >> $GITHUB_OUTPUT

  sign-in:
    needs: check-if-already-signed
    if: needs.check-if-already-signed.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ← 重点添加
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ... 其余你的步骤保持不变（随机延迟、Python环境、签到脚本等）
